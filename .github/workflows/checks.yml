name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
      - run: python -m compileall pipeline/unfold_pipeline evals/run.py
      - name: chunker sanity
        run: |
          python - <<'EOF'
          from unfold_pipeline.chunk import chunk_text, CHUNK_CHARS
          chunks = chunk_text("para. " * 200 + "\n\n" + "more. " * 800)
          assert len(chunks) >= 2, chunks
          assert all(len(c) <= CHUNK_CHARS for c in chunks), [len(c) for c in chunks]
          assert chunk_text("short") == ["short"]
          print(f"chunker OK ({len(chunks)} chunks)")
          EOF
