[project]
name = "unfold-pipeline"
version = "0.1.0"
description = "unfold4all ingestion pipeline: registry -> crawl -> chunk -> embed -> pgvector"
requires-python = ">=3.12"
dependencies = [
    "trafilatura>=2.0",
    "youtube-transcript-api>=1.0",
    "voyageai>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
unfold-pipeline = "unfold_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unfold_pipeline*"]
